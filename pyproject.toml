[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-forge"
version = "0.1.0"
description = "Multi-agent AI pipeline: idea to shippable code"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "anthropic>=0.40.0",
    "pydantic>=2.0",
    "rich>=13.0",
    "click>=8.0",
    "python-dotenv>=1.0",
]

[project.scripts]
agent-forge = "agent_forge.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_forge"]
